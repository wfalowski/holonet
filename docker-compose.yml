services:
  holonet:
    image: ghcr.io/wfalowski/holonet:latest
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      DATABASE_URL: postgres://holonet:${POSTGRES_PASSWORD:-holonet}@postgres:5432/holonet
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: holonet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-holonet}
      POSTGRES_DB: holonet
    volumes:
      - holonet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holonet -d holonet"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  holonet-pgdata:
